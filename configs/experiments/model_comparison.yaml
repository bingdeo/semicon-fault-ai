base_config: configs/base.yaml

experiment:
  id: A-E1-model-comparison
  split_id: secom_stratified_seed42_v1
  split_file: data/splits/secom_stratified_seed42_v1.csv

features:
  max_missing_fraction: 0.95
  drop_constant: true
  imputation_strategy: median
  add_missing_indicators: true

selection:
  recall_fixed_precision: 0.50

comparison:
  seed: 20261126
  outer_folds: 4
  outer_repeats: 2
  inner_folds: 3
  sensor_counts: [40, 100]

  # Candidate settings are shared by each model's two sensor conditions.
  logistic_regression:
    - {C: 0.01, penalty: l1, class_weight: balanced}
    - {C: 0.01, penalty: l2, class_weight: null}
    - {C: 0.001, penalty: l2, class_weight: balanced}
    - {C: 0.1, penalty: l1, class_weight: balanced}

  xgboost:
    - {n_estimators: 300, max_depth: 4, learning_rate: 0.03, min_child_weight: 5, subsample: 0.8, colsample_bytree: 0.7, reg_alpha: 0.1, reg_lambda: 10.0, scale_pos_weight: 1.0}
    - {n_estimators: 200, max_depth: 2, learning_rate: 0.04, min_child_weight: 5, subsample: 0.85, colsample_bytree: 0.8, reg_alpha: 0.1, reg_lambda: 5.0, scale_pos_weight: 4.0}

  lightgbm:
    - {num_leaves: 7, min_child_samples: 25, n_estimators: 200, learning_rate: 0.04, reg_lambda: 5.0, class_weight: null}
    - {num_leaves: 7, min_child_samples: 40, n_estimators: 250, learning_rate: 0.03, reg_lambda: 10.0, class_weight: balanced}
    - {num_leaves: 15, min_child_samples: 20, n_estimators: 200, learning_rate: 0.04, reg_lambda: 10.0, class_weight: null}
