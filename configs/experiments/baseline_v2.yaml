base_config: configs/base.yaml

experiment:
  id: A-E1-baseline-v2
  split_id: secom_stratified_seed42_v1
  split_file: data/splits/secom_stratified_seed42_v1.csv

features:
  max_missing_fraction: 0.95
  drop_constant: true
  imputation_strategy: median
  add_missing_indicators: true

selection:
  metric: average_precision
  threshold_rule: max_development_oof_f1
  recall_fixed_precision: 0.50

improvement:
  development_splits: [train, validation]
  search_cv_folds: 5
  search_seed: 20261125
  oof_cv_folds: 5
  oof_seed: 20261207
  outer_search_jobs: 8
  xgboost_iterations: 32
  extratrees_iterations: 24
  ensemble_weight_step: 0.05

logistic_search:
  c_values: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
  penalties: [l1, l2]
  class_weights: [null, balanced]
  solver: liblinear
  max_iter: 5000

xgboost_search_space:
  column_filter__max_missing_fraction: [0.70, 0.80, 0.90, 0.95, 1.0]
  model__n_estimators: [150, 250, 350, 500, 700]
  model__max_depth: [2, 3, 4, 5, 6]
  model__learning_rate: [0.01, 0.02, 0.03, 0.05, 0.08]
  model__min_child_weight: [1, 3, 5, 8, 12]
  model__subsample: [0.65, 0.80, 0.95, 1.0]
  model__colsample_bytree: [0.50, 0.65, 0.80, 1.0]
  model__reg_alpha: [0.0, 0.05, 0.1, 0.3, 1.0]
  model__reg_lambda: [1.0, 3.0, 5.0, 10.0, 20.0]
  model__gamma: [0.0, 0.1, 0.5, 1.0]
  model__scale_pos_weight: [1.0, 3.8, 14.1]

extratrees_search_space:
  column_filter__max_missing_fraction: [0.70, 0.80, 0.90, 0.95, 1.0]
  model__n_estimators: [250, 400, 600]
  model__max_depth: [null, 6, 10, 16, 24]
  model__max_features: [sqrt, 0.20, 0.35, 0.50, 0.75, 1.0]
  model__min_samples_leaf: [1, 2, 3, 5, 8]
  model__criterion: [gini, entropy, log_loss]
  model__class_weight: [null, balanced, balanced_subsample]
  model__bootstrap: [false, true]
