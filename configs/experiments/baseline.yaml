base_config: configs/base.yaml

experiment:
  id: A-E1-baseline
  split_id: secom_stratified_seed42_v1
  split_file: data/splits/secom_stratified_seed42_v1.csv
  models:
    - dummy
    - logistic_regression
    - xgboost

features:
  max_missing_fraction: 0.95
  drop_constant: true
  imputation_strategy: median
  add_missing_indicators: true

selection:
  metric: average_precision
  threshold_rule: max_validation_f1
  recall_fixed_precision: 0.50

logistic_search:
  c_values: [0.001, 0.01, 0.1, 1.0, 10.0]
  penalties: [l1, l2]
  class_weights: [null, balanced]
  solver: liblinear
  max_iter: 3000

xgboost_search:
  candidates:
    - {n_estimators: 200, max_depth: 2, learning_rate: 0.03, min_child_weight: 1, subsample: 0.8, colsample_bytree: 0.8, reg_alpha: 0.0, reg_lambda: 1.0, scale_pos_weight: 1.0}
    - {n_estimators: 400, max_depth: 2, learning_rate: 0.03, min_child_weight: 1, subsample: 0.8, colsample_bytree: 0.8, reg_alpha: 0.1, reg_lambda: 5.0, scale_pos_weight: balanced}
    - {n_estimators: 300, max_depth: 3, learning_rate: 0.05, min_child_weight: 1, subsample: 0.8, colsample_bytree: 0.8, reg_alpha: 0.0, reg_lambda: 1.0, scale_pos_weight: 1.0}
    - {n_estimators: 300, max_depth: 3, learning_rate: 0.05, min_child_weight: 1, subsample: 0.8, colsample_bytree: 0.8, reg_alpha: 0.0, reg_lambda: 5.0, scale_pos_weight: balanced}
    - {n_estimators: 500, max_depth: 3, learning_rate: 0.03, min_child_weight: 5, subsample: 0.9, colsample_bytree: 0.7, reg_alpha: 0.1, reg_lambda: 10.0, scale_pos_weight: balanced}
    - {n_estimators: 200, max_depth: 4, learning_rate: 0.05, min_child_weight: 1, subsample: 0.8, colsample_bytree: 0.8, reg_alpha: 0.0, reg_lambda: 5.0, scale_pos_weight: balanced}
    - {n_estimators: 300, max_depth: 4, learning_rate: 0.03, min_child_weight: 5, subsample: 0.8, colsample_bytree: 0.7, reg_alpha: 0.1, reg_lambda: 10.0, scale_pos_weight: 1.0}
    - {n_estimators: 200, max_depth: 5, learning_rate: 0.03, min_child_weight: 5, subsample: 0.8, colsample_bytree: 0.6, reg_alpha: 0.5, reg_lambda: 10.0, scale_pos_weight: balanced}
    - {n_estimators: 500, max_depth: 2, learning_rate: 0.02, min_child_weight: 1, subsample: 1.0, colsample_bytree: 1.0, reg_alpha: 0.0, reg_lambda: 5.0, scale_pos_weight: balanced}
    - {n_estimators: 150, max_depth: 3, learning_rate: 0.10, min_child_weight: 1, subsample: 1.0, colsample_bytree: 0.8, reg_alpha: 0.0, reg_lambda: 1.0, scale_pos_weight: 1.0}
    - {n_estimators: 300, max_depth: 2, learning_rate: 0.05, min_child_weight: 10, subsample: 0.8, colsample_bytree: 0.7, reg_alpha: 0.5, reg_lambda: 10.0, scale_pos_weight: balanced}
    - {n_estimators: 400, max_depth: 4, learning_rate: 0.02, min_child_weight: 10, subsample: 0.9, colsample_bytree: 0.6, reg_alpha: 1.0, reg_lambda: 10.0, scale_pos_weight: balanced}
