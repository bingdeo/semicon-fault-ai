project:
  name: semicon-fault-ai
  random_seed: 42

paths:
  raw_data: data/raw
  processed_data: data/processed
  splits: data/splits
  results: results
  predictions: results/predictions
  figures: results/figures
  reports: reports

dataset:
  name: SECOM
  source: https://archive.ics.uci.edu/dataset/179/secom
  download_url: https://archive.ics.uci.edu/static/public/179/secom.zip
  expected_files:
    - secom.data
    - secom_labels.data
    - secom.names
  # Verified from the downloaded official file: -1=pass, 1=fail.
  raw_fail_label: 1

split:
  strategy: stratified
  train_fraction: 0.60
  validation_fraction: 0.20
  test_fraction: 0.20
  random_seed: 42

evaluation:
  positive_class: fail
  primary_metric: average_precision
  threshold_source: validation

runtime:
  # Resource ceiling for this machine; models may use fewer threads when faster.
  n_jobs: 8
  cpu_threads: 8
  optimization_goal: best_predictive_performance
  device: auto

model_selection:
  objective: maximize_validation_average_precision
  tuning_policy: model_specific_recorded_budget
  test_usage: final_evaluation_only

benchmark:
  warmup_runs: 3
  measurement_runs: 10
  resource_policy: best_effort_same_machine

