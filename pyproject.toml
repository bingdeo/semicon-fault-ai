[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semicon-fault-ai"
version = "0.1.0"
description = "Fair benchmark of classical tabular ML and Tabular Foundation Models on SECOM."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.0",
    "psutil>=5.9",
    "PyYAML>=6.0",
    "scikit-learn>=1.4",
    "scipy>=1.10",
    "seaborn>=0.13",
]

[project.optional-dependencies]
baseline = [
    "xgboost>=2.0",
]
comparison = [
    "xgboost>=2.0",
    "lightgbm>=4.6,<5",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["src", "src.models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

